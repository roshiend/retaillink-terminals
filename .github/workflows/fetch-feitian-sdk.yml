name: Fetch FEITIAN SDK candidate

on:
  push:
    branches:
      - feat/terminal-driver-abstraction
    paths:
      - .github/workflows/fetch-feitian-sdk.yml
  pull_request:
    paths:
      - .github/workflows/fetch-feitian-sdk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Download FTSDK candidate
        run: |
          set -euo pipefail
          mkdir -p feitian-sdk
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/avinashtilekar/CollectionApp/master/app/libs/FTSDK_api_V1.0.0.71_20220401.jar' \
            --output feitian-sdk/FTSDK_api_V1.0.0.71_20220401.jar
          test -s feitian-sdk/FTSDK_api_V1.0.0.71_20220401.jar

      - name: Verify JAR and record metadata
        run: |
          set -euo pipefail
          file feitian-sdk/FTSDK_api_V1.0.0.71_20220401.jar | tee feitian-sdk/FILE.txt
          sha256sum feitian-sdk/FTSDK_api_V1.0.0.71_20220401.jar | tee feitian-sdk/SHA256.txt
          unzip -t feitian-sdk/FTSDK_api_V1.0.0.71_20220401.jar | tee feitian-sdk/ZIP-TEST.txt
          unzip -l feitian-sdk/FTSDK_api_V1.0.0.71_20220401.jar | tee feitian-sdk/CONTENTS.txt

      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: feitian-ftsdk-candidate-1.0.0.71
          path: feitian-sdk/
          if-no-files-found: error
