name: Android Terminal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/terminal-driver-abstraction
      - feat/mypos-appmarket-beta
    paths:
      - 'apps/android-terminal/**'
      - '.github/workflows/android-terminal.yml'
  pull_request:
    paths:
      - 'apps/android-terminal/**'
      - '.github/workflows/android-terminal.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.5.0'

      - name: Install Android API 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Fetch verified FEITIAN FTSDK
        working-directory: apps/android-terminal
        shell: bash
        run: bash ./fetch-feitian-sdk.sh

      - name: Build F20 terminal APK
        id: build
        working-directory: apps/android-terminal
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleF20Release 2>&1 | tee build.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify F20 APK signatures and metadata
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find apps/android-terminal/app/build/outputs/apk/f20/release -type f -name '*.apk' | head -1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-verification.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -20 | tee apk-metadata.txt
          grep -q "package: name='com.retaillink.f20.myposbridge'" apk-metadata.txt
          sha256sum "$APK" | tee apk-sha256.txt
          sha256sum apps/android-terminal/app/libs/FTSDK_api_V1.0.0.71_20220401.jar | tee feitian-sdk-sha256.txt
          mkdir -p f20-artifact
          cp "$APK" f20-artifact/Retaillink-F20-Diagnostics.apk

      - name: Upload installable F20 APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retaillink-f20-driver-build
          path: |
            f20-artifact/Retaillink-F20-Diagnostics.apk
            feitian-sdk-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Fail job when Gradle failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
