name: Android Terminal APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android-terminal/**'
      - '.github/workflows/android-terminal.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.5.0'

      - name: Install Android API 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build F20 myPOS Smart SDK Stage 1 APK
        working-directory: apps/android-terminal
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signatures and metadata
        run: |
          APK=apps/android-terminal/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -20
          sha256sum "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retaillink-f20-mypos-stage1
          path: apps/android-terminal/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified APK to repository
        run: |
          mkdir -p artifacts/f20-mypos-stage1
          cp apps/android-terminal/app/build/outputs/apk/release/app-release.apk artifacts/f20-mypos-stage1/Retaillink-F20-myPOS-Stage1.apk
          sha256sum artifacts/f20-mypos-stage1/Retaillink-F20-myPOS-Stage1.apk > artifacts/f20-mypos-stage1/SHA256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/f20-mypos-stage1/Retaillink-F20-myPOS-Stage1.apk artifacts/f20-mypos-stage1/SHA256.txt
          if git diff --cached --quiet; then
            echo "No artifact change to publish"
          else
            git commit -m "test(f20): publish verified myPOS stage1 APK [skip ci]"
            git push
          fi
