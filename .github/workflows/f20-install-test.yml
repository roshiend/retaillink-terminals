name: F20 Install Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android-terminal/installtest/**'
      - 'apps/android-terminal/settings.gradle'
      - '.github/workflows/f20-install-test.yml'

jobs:
  build-install-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.5.0'

      - name: Install Android API 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build minimal F20 install test
        working-directory: apps/android-terminal
        run: gradle --no-daemon :installtest:assembleRelease

      - name: Verify APK signatures and metadata
        run: |
          APK=apps/android-terminal/installtest/build/outputs/apk/release/installtest-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -20
          sha256sum "$APK"

      - name: Upload F20 install test APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: f20-install-test-v1-v2
          path: apps/android-terminal/installtest/build/outputs/apk/release/installtest-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified probe for direct retrieval
        run: |
          mkdir -p artifacts/f20-install-test
          cp apps/android-terminal/installtest/build/outputs/apk/release/installtest-release.apk artifacts/f20-install-test/F20-Install-Test.apk
          sha256sum artifacts/f20-install-test/F20-Install-Test.apk > artifacts/f20-install-test/SHA256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/f20-install-test/F20-Install-Test.apk artifacts/f20-install-test/SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m 'test(f20): publish verified install probe [skip ci]'
          git push
