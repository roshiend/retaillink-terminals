services:
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      CHECKOUT_BASE_URL: ${CHECKOUT_BASE_URL}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN}
      REQUIRE_IDEMPOTENCY_KEYS: "true"
      ENABLE_RATE_LIMIT: "true"
      TRUST_PROXY: "true"
      MAX_BODY_BYTES: "1048576"
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_AUTH_MAX: "30"
      RATE_LIMIT_PUBLIC_MAX: "120"
      RATE_LIMIT_API_MAX: "300"
    ports:
      - "127.0.0.1:3001:3001"
    stop_grace_period: 30s

  dashboard:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.dashboard
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    ports:
      - "127.0.0.1:3000:3000"

  checkout:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.checkout
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    ports:
      - "127.0.0.1:3002:3002"

# Production expectations:
# - Put all three services behind an HTTPS ingress/load balancer.
# - Use a managed PostgreSQL service; do not run the production database here.
# - Store DATABASE_URL and all future processor/KMS credentials in a secrets manager.
# - Restrict the bound localhost ports so only the ingress can reach them.
