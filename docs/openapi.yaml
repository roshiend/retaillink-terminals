openapi: 3.1.0
info:
  title: Retaillink Terminals Sandbox API
  version: 0.3.0
  description: Sandbox-only payment gateway API. Never submit real card data.
servers:
  - url: http://localhost:3001
components:
  securitySchemes:
    SecretKey:
      type: http
      scheme: bearer
      bearerFormat: sk_test
  schemas:
    PaymentIntentCreate:
      type: object
      required: [amount]
      properties:
        amount: { type: integer, minimum: 1, description: Amount in minor currency units }
        currency: { type: string, default: LKR, minLength: 3, maxLength: 3 }
        customer: { type: string, description: Sandbox customer ID. Requires Idempotency-Key when supplied. }
        merchant_reference: { type: string }
        description: { type: string }
        metadata: { type: object, additionalProperties: true }
    PaymentLinkCreate:
      type: object
      required: [title, amount]
      properties:
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        amount: { type: integer, minimum: 1, description: Fixed amount in minor currency units }
        currency: { type: string, default: LKR, minLength: 3, maxLength: 3 }
        merchant_reference_prefix: { type: string, maxLength: 80 }
    RefundCreate:
      type: object
      properties:
        amount: { type: integer, minimum: 1 }
        reason: { type: string }
    CustomerCreate:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        metadata: { type: object, additionalProperties: true }
      description: At least one of name, email or phone is required.
    CustomerUpdate:
      type: object
      properties:
        name: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        metadata: { type: [object, 'null'], additionalProperties: true }
    WebhookCreate:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
security:
  - SecretKey: []
paths:
  /health:
    get:
      security: []
      summary: API health check
      responses:
        '200': { description: Healthy }
  /v1/payment_intents:
    get:
      summary: List payment intents
      responses:
        '200': { description: Payment intent list }
    post:
      summary: Create payment intent
      description: If `customer` is supplied, the Idempotency-Key header is required and retries must use the same customer.
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentIntentCreate' }
      responses:
        '201': { description: Payment intent created }
        '400': { description: Invalid request or missing required idempotency key }
        '401': { description: Invalid API key }
        '403': { description: Blocked by an active sandbox risk rule }
        '409': { description: Idempotency conflict }
  /v1/payment_intents/{id}:
    get:
      summary: Retrieve payment intent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Payment intent }
        '404': { description: Not found }
  /v1/payment_intents/{id}/cancel:
    post:
      summary: Cancel an unpaid Payment Intent
      description: Cancellation is idempotent. Succeeded or processing intents cannot be canceled. For invoice-linked intents, void the invoice instead.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Payment Intent canceled or already canceled }
        '401': { description: Invalid API key }
        '404': { description: Payment Intent not found }
        '409': { description: Payment Intent cannot be canceled in its current state }
  /v1/payment_links:
    get:
      summary: List Payment Links
      responses:
        '200': { description: Payment Link list }
    post:
      summary: Create a reusable fixed-amount Payment Link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentLinkCreate' }
      responses:
        '201': { description: Payment Link created }
        '400': { description: Invalid request }
        '401': { description: Invalid API key }
  /v1/payment_links/{id}:
    get:
      summary: Retrieve Payment Link
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Payment Link }
        '404': { description: Not found }
  /v1/payment_links/{id}/state:
    post:
      summary: Enable or disable a Payment Link
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '200': { description: Payment Link state updated }
        '404': { description: Not found }
  /public/payment_links/{token}:
    get:
      security: []
      summary: Retrieve the public Payment Link landing details
      description: Read-only. This endpoint never creates a Payment Intent.
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        '200': { description: Public Payment Link details }
        '404': { description: Link unavailable or disabled }
  /public/payment_links/{token}/checkout:
    post:
      security: []
      summary: Start checkout from a Payment Link
      description: Creates a fresh Payment Intent for a customer action. Replaying the same Idempotency-Key returns the same Payment Intent.
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '201': { description: Checkout Payment Intent created }
        '200': { description: Existing idempotent checkout returned }
        '403': { description: Blocked by an active sandbox risk rule }
        '404': { description: Link unavailable or disabled }
  /v1/payments:
    get:
      summary: List payments
      responses:
        '200': { description: Payment list }
  /v1/payments/{id}:
    get:
      summary: Retrieve payment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Payment }
        '404': { description: Not found }
  /v1/payments/{id}/refunds:
    post:
      summary: Refund payment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundCreate' }
      responses:
        '201': { description: Refund created }
  /v1/refunds:
    get:
      summary: List refunds
      responses:
        '200': { description: Refund list }
  /v1/customers:
    get:
      summary: List customers
      responses:
        '200': { description: Customer list }
    post:
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerCreate' }
      responses:
        '201': { description: Customer created }
        '409': { description: Customer email already exists }
  /v1/customers/{id}:
    get:
      summary: Retrieve customer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Customer }
        '404': { description: Not found }
    post:
      summary: Update customer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerUpdate' }
      responses:
        '200': { description: Customer updated }
        '404': { description: Not found }
    delete:
      summary: Delete customer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Customer deleted }
        '404': { description: Not found }
  /v1/balance:
    get:
      summary: Retrieve merchant payable balance
      responses:
        '200': { description: Balance }
  /v1/settlements:
    get:
      summary: List settlements
      responses:
        '200': { description: Settlement list }
  /v1/webhook_endpoints:
    get:
      summary: List webhook endpoints
      responses:
        '200': { description: Webhook endpoint list }
    post:
      summary: Create webhook endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookCreate' }
      responses:
        '201': { description: Endpoint created }
  /v1/webhook_endpoints/{id}:
    delete:
      summary: Delete webhook endpoint
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Endpoint deleted }
  /v1/webhook_deliveries:
    get:
      summary: List recent webhook deliveries
      responses:
        '200': { description: Webhook delivery list }
