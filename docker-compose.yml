services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: retaillink
      POSTGRES_PASSWORD: retaillink_dev
      POSTGRES_DB: retaillink_terminal
    ports:
      - "5432:5432"
    volumes:
      - retaillink_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retaillink -d retaillink_terminal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  retaillink_postgres:
