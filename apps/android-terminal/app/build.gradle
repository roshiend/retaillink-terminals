plugins {
    id 'com.android.application'
}

android {
    namespace 'com.retaillink.terminal.sandbox'
    compileSdk 36

    defaultConfig {
        applicationId 'com.retaillink.terminal'
        minSdk 23
        targetSdk 29
        versionCode 1
        versionName '0.5.0'
    }

    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing false
            enableV4Signing false
        }
    }

    flavorDimensions += 'terminal'
    productFlavors {
        appmarket {
            dimension 'terminal'
            // Permanent package for myPOS Demo/Production AppMarket releases.
            applicationId 'com.retaillink.terminal'
        }
        f20 {
            dimension 'terminal'
            // Preserve the existing owner-controlled F20 diagnostic package.
            applicationId 'com.retaillink.f20.myposbridge'
            versionCode 7
            versionName '0.5.0-f20'
            signingConfig signingConfigs.debug
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
        }
        release {
            // AppMarket release is deliberately left without a signingConfig.
            // If myPOS Demo AppMarket requires developer signing, use a private
            // release key supplied outside source control; never commit it here.
            debuggable false
            minifyEnabled false
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Official myPOS Smart SDK is shared by both variants. Secure payment/card
    // handling stays inside the myPOS payment application/service.
    implementation 'com.mypos:mypossmartsdk:1.0.8'

    // FEITIAN hardware SDK exists only in the F20 diagnostic variant and is not
    // packaged into the myPOS AppMarket APK.
    f20Implementation files('libs/FTSDK_api_V1.0.0.71_20220401.jar')
}
