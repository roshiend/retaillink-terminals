plugins {
    id 'com.android.application'
}

android {
    namespace 'com.retaillink.terminal.sandbox'
    compileSdk 36

    defaultConfig {
        // Fresh package ID prevents any stale/partial install or signing history
        // from earlier Retaillink sandbox APKs affecting this F20 test.
        applicationId 'com.retaillink.f20.myposbridge'
        // API 23 deliberately keeps v1/JAR signing in the release APK as an
        // additional compatibility path for older/custom package installers.
        // The physical F20 is Android 10 (API 29), so runtime compatibility is unchanged.
        minSdk 23
        targetSdk 29
        versionCode 4
        versionName '0.2.1'
    }

    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing false
            enableV4Signing false
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
        }
        release {
            // Owner-controlled sandbox/test build only. This is not a myPOS
            // production/AppMarket signing key.
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Official myPOS Smart SDK. It delegates payment/card handling to the
    // certified myPOS payment application; this app never handles PAN/PIN.
    implementation 'com.mypos:mypossmartsdk:1.0.8'
}
