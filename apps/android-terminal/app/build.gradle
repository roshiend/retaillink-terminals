plugins {
    id 'com.android.application'
}

android {
    namespace 'com.retaillink.terminal.sandbox'
    compileSdk 36

    defaultConfig {
        applicationId 'com.retaillink.f20.myposbridge'
        minSdk 23
        targetSdk 29
        versionCode 6
        versionName '0.4.0'
    }

    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing false
            enableV4Signing false
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
        }
        release {
            // Owner-controlled development build only. This is not a myPOS or
            // FEITIAN production signing key.
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Official myPOS Smart SDK driver. Secure card/PIN handling remains inside
    // the vendor payment application; Retaillink receives only SDK results.
    implementation 'com.mypos:mypossmartsdk:1.0.8'

    // FEITIAN FTSDK v1.0.0.71. The JAR is fetched separately and SHA-256
    // verified before CI/local builds so the vendor binary is not silently
    // replaced by a different file.
    implementation files('libs/FTSDK_api_V1.0.0.71_20220401.jar')
}
