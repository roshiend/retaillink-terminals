plugins {
    id 'com.android.application'
}

android {
    namespace 'com.retaillink.terminal.sandbox'
    compileSdk 36

    defaultConfig {
        applicationId 'com.retaillink.terminal.sandbox'
        minSdk 24
        // The first physical target is the Android 10 (API 29) FEITIAN F20.
        // Keeping targetSdk at 29 avoids introducing newer-platform behaviour
        // changes while we determine the vendor installation/signing policy.
        targetSdk 29
        versionCode 2
        versionName '0.1.1'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
        }
        release {
            // Compatibility/test release for owner-controlled sandbox hardware.
            // It intentionally uses the Android debug signing identity so CI can
            // produce a signed, directly installable APK without storing a
            // production signing secret. It is NOT a production distribution key.
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
