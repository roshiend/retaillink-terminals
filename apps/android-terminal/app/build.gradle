plugins {
    id 'com.android.application'
}

android {
    namespace 'com.retaillink.terminal.sandbox'
    compileSdk 36

    defaultConfig {
        applicationId 'com.retaillink.terminal.sandbox'
        minSdk 24
        // The first physical target is the Android 10 (API 29) FEITIAN F20.
        // Keeping targetSdk at 29 avoids introducing newer-platform behaviour
        // changes while we determine the vendor installation/signing policy.
        targetSdk 29
        versionCode 3
        versionName '0.2.0'
    }

    signingConfigs {
        debug {
            // Explicitly include the signature schemes understood by Android 10
            // and older/custom package installers on payment terminals.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing false
            enableV4Signing false
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
        }
        release {
            // Owner-controlled sandbox/test build only. This is not a myPOS
            // production/AppMarket signing key.
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
        }
    }

    // This APK is a direct-sideload compatibility build for a privately owned
    // Android 10 terminal, not a Google Play distribution artifact.
    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Official myPOS Smart SDK. It delegates payment/card handling to the
    // certified myPOS payment application; this app never handles PAN/PIN.
    implementation 'com.mypos:mypossmartsdk:1.0.8'
}
